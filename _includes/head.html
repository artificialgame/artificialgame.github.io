<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}" />
<link rel="canonical" href="{{ site.url }}{{ page.url }}" />
<meta property="og:type" content="{% if page.collection == 'games' %}website{% else %}website{% endif %}" />
<meta property="og:title" content="{{ page.title | default: site.title }}" />
<meta property="og:description" content="{{ page.short_description | default: page.description | default: site.description }}" />
<meta property="og:url" content="{{ site.url }}{{ page.url }}" />
<meta property="og:image" content="{{ site.url }}{{ page.thumbnail | default: '/assets/images/default-game.svg' }}" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{ page.title | default: site.title }}" />
<meta name="twitter:description" content="{{ page.short_description | default: page.description | default: site.description }}" />
<meta name="twitter:image" content="{{ site.url }}{{ page.thumbnail | default: '/assets/images/default-game.svg' }}" />
<link rel="preload" href="{{ '/assets/css/style.css' | relative_url }}" as="style" />
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
<script defer src="{{ '/assets/js/main.js' | relative_url }}"></script>
{% if page.collection == 'games' %}
  {% include meta-game.html %}
  {% include schema-game.jsonld %}
{% endif %}
